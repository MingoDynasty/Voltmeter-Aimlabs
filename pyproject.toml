[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voltmeter-aimlabs"
version = "0.1.0"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
dependencies = [
    "requests>=2.32",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "mypy>=1.11",
    "pylint>=3.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.setuptools]
py-modules = [
    "aimlab_scores",
    "aimlabs_client",
    "benchmark_constants",
    "config",
    "main",
    "stopwatch",
    "voltaic_benchmarks",
]
