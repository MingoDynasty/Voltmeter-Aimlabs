[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voltmeter-aimlabs"
version = "0.1.0"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
dependencies = [
    "requests>=2.32",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.scripts]
voltmeter = "cli:main"

[project.optional-dependencies]
# `voltmeter login` opens an embedded browser via pywebview; everything else
# works without it (the CLI prints an install hint when it is missing).
login = ["pywebview>=5"]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.setuptools]
py-modules = [
    "aimlab_scores",
    "aimlabs_auth",
    "aimlabs_client",
    "aimlabs_history",
    "benchmark_constants",
    "cli",
    "config",
    "history_report",
    "history_sync",
    "main",
    "play_store",
    "scenario_catalog",
    "stopwatch",
    "voltaic_benchmarks",
]
