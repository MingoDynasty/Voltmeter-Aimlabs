[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voltmeter-aimlabs"
version = "0.1.0"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
dependencies = [
    "requests>=2.32",
    "tomli>=2.0; python_version < '3.11'",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"

[tool.setuptools]
py-modules = [
    "aimlab_scores",
    "aimlabs_client",
    "benchmark_constants",
    "config",
    "main",
    "stopwatch",
    "voltaic_benchmarks",
]
