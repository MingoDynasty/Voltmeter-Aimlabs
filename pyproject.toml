[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voltmeter-aimlabs"
version = "0.1.0"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
dependencies = [
    "requests>=2.32",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.scripts]
voltmeter = "cli:main"

[project.optional-dependencies]
# `voltmeter login` opens an embedded browser via pywebview; everything else
# works without it (the CLI prints an install hint when it is missing).
login = ["pywebview>=5"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "pre-commit>=4.6.0",
]

[tool.uv]
required-version = "==0.11.26"

[tool.mypy]
ignore_missing_imports = true
files = [
    "aimlab_scores.py",
    "aimlabs_auth.py",
    "aimlabs_client.py",
    "aimlabs_history.py",
    "cli.py",
    "config.py",
    "history_report.py",
    "history_sync.py",
    "play_store.py",
    "scenario_catalog.py",
    "stopwatch.py",
    "voltaic_benchmarks.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
force-exclude = true

[tool.ruff.lint]
extend-select = [
    "I",    # import sorting
    "E",    # pycodestyle errors, incl. E501
    "W",    # pycodestyle warnings
    "D1",   # missing docstrings (presence only)
    "PL",   # pylint-derived rules
    "ARG",  # unused arguments
    "G",    # logging format
    "BLE",  # blind except
]
ignore = [
    "PLR2004",  # magic-value comparisons — spec-wide ignore
    "D1",       # TRANSITIONAL — docstring campaign is the follow-up PR; remove it there
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # hard ceiling; formatter wraps at 88

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "PLR09", "ARG"]

[tool.setuptools]
py-modules = [
    "aimlab_scores",
    "aimlabs_auth",
    "aimlabs_client",
    "aimlabs_history",
    "cli",
    "config",
    "history_report",
    "history_sync",
    "play_store",
    "scenario_catalog",
    "stopwatch",
    "voltaic_benchmarks",
]
