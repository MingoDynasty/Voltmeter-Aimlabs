name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Compile modules
        run: >
          python -m py_compile
          aimlab_scores.py
          aimlabs_client.py
          benchmark_constants.py
          config.py
          main.py
          play_store.py
          stopwatch.py
          voltaic_benchmarks.py
          tests/test_play_store.py
          tests/test_voltaic_benchmarks.py
          tests/test_aimlab_scores.py
          tests/test_aimlabs_client.py
          tests/test_benchmark_constants.py
          tests/test_config.py

      - name: Type check
        run: >
          python -m mypy
          aimlab_scores.py
          aimlabs_client.py
          benchmark_constants.py
          config.py
          main.py
          play_store.py
          stopwatch.py
          voltaic_benchmarks.py

      - name: Format check
        run: >
          python -m black --check
          aimlab_scores.py
          aimlabs_client.py
          benchmark_constants.py
          config.py
          main.py
          play_store.py
          stopwatch.py
          voltaic_benchmarks.py
          tests

      - name: Lint
        run: python -m ruff check .

      - name: Pylint
        run: >
          python -m pylint
          aimlab_scores.py
          aimlabs_client.py
          benchmark_constants.py
          config.py
          main.py
          play_store.py
          stopwatch.py
          voltaic_benchmarks.py

      - name: Run tests
        run: python -m pytest
