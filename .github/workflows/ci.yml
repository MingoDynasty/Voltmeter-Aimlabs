name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Compile modules
        run: >
          uv run python -m py_compile
          aimlab_scores.py
          aimlabs_auth.py
          aimlabs_client.py
          aimlabs_history.py
          benchmark_constants.py
          cli.py
          config.py
          history_report.py
          history_sync.py
          main.py
          play_store.py
          scenario_catalog.py
          stopwatch.py
          voltaic_benchmarks.py
          tests/test_aimlab_scores.py
          tests/test_aimlabs_auth.py
          tests/test_aimlabs_client.py
          tests/test_aimlabs_history.py
          tests/test_benchmark_constants.py
          tests/test_cli.py
          tests/test_config.py
          tests/test_history_report.py
          tests/test_history_sync.py
          tests/test_play_store.py
          tests/test_scenario_catalog.py
          tests/test_voltaic_benchmarks.py

      - name: Type check
        run: >
          uv run python -m mypy
          aimlab_scores.py
          aimlabs_auth.py
          aimlabs_client.py
          aimlabs_history.py
          benchmark_constants.py
          cli.py
          config.py
          history_report.py
          history_sync.py
          main.py
          play_store.py
          scenario_catalog.py
          stopwatch.py
          voltaic_benchmarks.py

      - name: Format check
        run: >
          uv run python -m black --check
          aimlab_scores.py
          aimlabs_auth.py
          aimlabs_client.py
          aimlabs_history.py
          benchmark_constants.py
          cli.py
          config.py
          history_report.py
          history_sync.py
          main.py
          play_store.py
          scenario_catalog.py
          stopwatch.py
          voltaic_benchmarks.py
          tests

      - name: Lint
        run: uv run python -m ruff check .

      - name: Pylint
        run: >
          uv run python -m pylint
          aimlab_scores.py
          aimlabs_auth.py
          aimlabs_client.py
          aimlabs_history.py
          benchmark_constants.py
          cli.py
          config.py
          history_report.py
          history_sync.py
          main.py
          play_store.py
          scenario_catalog.py
          stopwatch.py
          voltaic_benchmarks.py

      - name: Run tests
        run: uv run python -m pytest
